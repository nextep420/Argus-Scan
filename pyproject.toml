[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-scan"
version = "0.1.0"
description = "A fast, modern, feature-rich network reconnaissance toolkit written in Python."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "NexTep" }
]
keywords = ["network", "scanner", "security", "recon", "port-scanner", "asyncio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking",
]
dependencies = [
    "rich>=13.0.0",
]

[project.optional-dependencies]
dns = ["dnspython>=2.4.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.urls]
Homepage = "https://github.com/YOUR-USERNAME/argus-scan"
Repository = "https://github.com/YOUR-USERNAME/argus-scan"

[project.scripts]
argus = "argus_scan.cli:main"

[tool.setuptools.packages.find]
include = ["argus_scan*"]

[tool.setuptools.package-data]
argus_scan = ["data/*.json"]
